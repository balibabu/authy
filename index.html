<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 4px 4px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f8fafc;
        }

        .add-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .add-btn:active {
            transform: scale(0.96);
            background: #1d4ed8;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: #475569;
            font-size: 0.9rem;
        }

        .card {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .serial {
            font-size: 0.75rem;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #475569;
            font-size: 1.1rem;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        .otp-current {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            color: #f8fafc;
            line-height: 1.1;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .otp-current:active {
            opacity: 0.6;
        }

        .otp-upcoming {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.1em;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: #38bdf8;
            transform-origin: left;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-backdrop.open .modal {
            transform: scale(1);
        }

        .modal form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal input {
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            color: #f8fafc;
            outline: none;
            font-family: inherit;
        }

        .modal input:focus {
            border-color: #38bdf8;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            color: #ffffff;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Authenticator</h1>
            <button class="add-btn" id="openModalBtn">+ Add</button>
        </header>
        <div class="cards-list" id="cardsList"></div>
    </div>

    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <form id="addForm">
                <input type="text" id="secretInput" placeholder="Secret Key" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Copied</div>

    <script src="app.js"></script>
</body>
</html>
