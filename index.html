<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticator — TOTP</title>
  <meta name="description" content="Time-based One-Time Password (TOTP) authenticator with local storage." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#6366f1',
              50: '#eef2ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            }
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .otp-digit { font-variant-numeric: tabular-nums; letter-spacing: 0.12em; }
    /* subtle fade for value changes */
    @keyframes pop { 0% { transform: scale(0.96); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
    .pop { animation: pop .25s ease-out; }
  </style>
</head>
<body class="dark bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div class="max-w-3xl mx-auto px-4 py-8 sm:py-12">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600/20 ring-1 ring-brand-500/40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 0h10.5a2.25 2.25 0 0 1 2.25 2.25v6.75a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5v-6.75a2.25 2.25 0 0 1 2.25-2.25Z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-semibold tracking-tight">Authenticator</h1>
          <p class="text-xs text-slate-400">Time-based One-Time Passwords · stored locally</p>
        </div>
      </div>
    </header>

    <!-- Add new secret -->
    <section class="bg-slate-900/60 ring-1 ring-slate-800 rounded-2xl p-4 sm:p-5 mb-6">
      <form id="addForm" class="flex flex-col sm:flex-row gap-3">
        <input
          id="labelInput"
          type="text"
          maxlength="40"
          placeholder="Label (e.g. GitHub)"
          class="flex-1 bg-slate-950/80 ring-1 ring-slate-800 focus:ring-brand-500 rounded-lg px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-500"
        />
        <input
          id="secretInput"
          type="text"
          placeholder="Secret (Base32)"
          autocomplete="off"
          spellcheck="false"
          class="flex-[2] bg-slate-950/80 ring-1 ring-slate-800 focus:ring-brand-500 rounded-lg px-3 py-2.5 text-sm font-mono outline-none transition placeholder:text-slate-500 uppercase"
        />
        <button type="submit" class="bg-brand-600 hover:bg-brand-500 active:scale-[0.98] text-white font-medium text-sm rounded-lg px-4 py-2.5 transition">
          Add
        </button>
      </form>
      <p class="mt-3 text-[11px] text-slate-500 leading-relaxed">
        Secrets are stored only in your browser (localStorage). Accounts not used for 7 days are removed automatically.
      </p>
    </section>

    <!-- List of accounts -->
    <section id="list" class="space-y-3"></section>

    <!-- Empty state -->
    <div id="empty" class="hidden text-center py-16">
      <div class="mx-auto w-12 h-12 rounded-full bg-slate-900 ring-1 ring-slate-800 flex items-center justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </div>
      <p class="text-slate-400 text-sm">No accounts yet</p>
      <p class="text-slate-600 text-xs mt-1">Add a secret key above to get started.</p>
    </div>

    <!-- Clear all -->
    <div id="clearWrap" class="hidden mt-8 flex justify-center">
      <button id="clearAll" class="text-xs text-rose-400/80 hover:text-rose-300 hover:underline underline-offset-4 transition">
        Clear all accounts
      </button>
    </div>

    <footer class="mt-10 text-center text-[11px] text-slate-600">
      RFC 6238 TOTP · 6 digits · 30s · HMAC-SHA1 · SHA-256 (WebCrypto)
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none transition-all duration-300 bg-slate-800 ring-1 ring-slate-700 text-slate-100 text-sm px-4 py-2 rounded-lg shadow-xl z-50"></div>

  <script src="app.js"></script>
</body>
</html>
